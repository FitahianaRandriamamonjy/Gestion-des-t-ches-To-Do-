services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: todo_app
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql:rw

volumes:
  database_data:
